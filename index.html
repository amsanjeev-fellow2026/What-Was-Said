<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What Was Said?</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#070A1F;--chalk:#F5F7FA;--gold:#FFC928;--tc:#FFC928;--glass:rgba(255,255,255,.08);--display:'Anton','Impact',sans-serif;--ui:'Barlow','Segoe UI',system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--ink);color:var(--chalk);font-family:var(--ui);overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
.hide{display:none!important}
#bg i{position:fixed;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.33;animation:drift 20s ease-in-out infinite alternate}
#bg i:nth-child(1){background:#5B3DF5;left:-15vmax;top:-15vmax}
#bg i:nth-child(2){background:#FF3B7A;right:-18vmax;bottom:-20vmax;animation-delay:-7s}
#bg i:nth-child(3){background:var(--tc);left:35vw;top:30vh;opacity:.16;width:40vmax;height:40vmax;transition:background .6s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.2)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(12px,2.5vh,28px);overflow:auto;text-align:center}
.play{padding-top:clamp(84px,14vh,120px)}
h1{margin:0;font:400 clamp(44px,10vh,96px)/1 var(--display);letter-spacing:.02em}
h1 span{display:inline-block;background:var(--gold);color:#14100A;padding:0 .2em;transform:skewX(-8deg);margin-left:.15em}
.sub{font-size:clamp(16px,2.6vh,24px);opacity:.85;margin:6px 0 12px}
.logo{height:clamp(30px,6vh,52px);margin-bottom:8px}
.btn{font:400 clamp(20px,3.6vh,32px)/1 var(--display);letter-spacing:.03em;color:#14100A;background:var(--gold);border:0;border-radius:12px;padding:.7em 1.4em;cursor:pointer;box-shadow:0 6px 0 #A67C00,0 12px 24px rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #A67C00}
.btn.ghost{background:var(--glass);color:var(--chalk);box-shadow:none;border:2px solid rgba(255,255,255,.3);font-size:clamp(16px,2.4vh,22px)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:2px}
.cnt{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-weight:700;font-size:clamp(16px,2.6vh,22px)}
.cnt button{width:clamp(44px,7vh,60px);height:clamp(44px,7vh,60px);border-radius:50%;border:2px solid rgba(255,255,255,.35);background:var(--glass);color:var(--chalk);font:400 clamp(22px,3.6vh,32px) var(--display);cursor:pointer}
.cnt button.on{background:var(--gold);color:#14100A;border-color:var(--gold)}
#cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%;max-width:1200px}
.tcard{flex:1 1 190px;max-width:260px;background:var(--glass);border-radius:12px;border-top:10px solid var(--c);padding:10px;backdrop-filter:blur(6px)}
.tcard input,.tcard textarea{width:100%;background:rgba(0,0,0,.35);color:var(--chalk);border:2px solid rgba(255,255,255,.18);border-radius:8px;font:700 18px var(--ui);padding:8px 10px;user-select:text}
.tcard input{font:400 24px var(--display)}
.tcard textarea{height:clamp(110px,24vh,230px);margin-top:8px;resize:none;line-height:1.35}
.tcard small{display:block;margin-top:4px;color:var(--c);font-weight:700;text-align:left}
.row{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;justify-content:center}
#board{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:8px;padding:10px;z-index:5}
.tile{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:6px;background:rgba(7,10,34,.8);border-left:8px solid var(--c);border-radius:8px;padding:6px 12px;transition:transform .3s,box-shadow .3s}
.tile.act{transform:translateY(4px) scale(1.04);box-shadow:0 0 0 3px var(--c),0 0 30px var(--c)}
.tile b{font:400 clamp(14px,2.6vh,22px) var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile em{font:400 clamp(26px,5vh,46px) var(--display);font-style:normal}
.tile em.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.6)}}
#flash{background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--tc) 50%,transparent),transparent 70%)}
.chips{display:flex;gap:8px;justify-content:center;margin:10px 0 18px;flex-wrap:wrap}
.chip{padding:6px 16px;border-radius:30px;background:var(--glass);border:2px solid rgba(255,255,255,.25);font-weight:700}
.chip.gold{background:var(--gold);color:#14100A;border-color:var(--gold)}
#fTeam{font:400 clamp(28px,6vh,56px) var(--display);color:var(--tc);animation:slide .6s both}
#fName{font:400 clamp(60px,18vh,190px)/1.05 var(--display);animation:pop .8s .35s cubic-bezier(.2,1.5,.4,1) both;text-shadow:0 8px 0 rgba(0,0,0,.4);overflow-wrap:anywhere}
.go{animation:pulse 1.2s infinite}
@keyframes slide{from{transform:translateX(-90vw)}}
@keyframes pop{from{transform:scale(.2) rotate(-8deg);opacity:0}}
@keyframes pulse{50%{transform:scale(1.06)}}
#sCard{position:relative;width:min(900px,94vw);background:rgba(10,14,50,.82);border-radius:18px;border-left:12px solid var(--tc);padding:clamp(18px,4vh,40px) clamp(18px,4vw,48px);box-shadow:0 0 70px color-mix(in srgb,var(--tc) 35%,transparent)}
#sTitle{font:400 clamp(22px,4vh,38px) var(--display);color:var(--tc);margin-bottom:10px}
#sText{font-size:clamp(22px,4.4vh,42px);line-height:1.45;font-weight:500;text-align:left}
#sText b{color:var(--gold);font-weight:700;border-bottom:3px solid var(--gold);animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{to{text-shadow:0 0 14px var(--gold)}}
#sCard.vanish{animation:vanish .9s forwards}
@keyframes vanish{to{opacity:0;filter:blur(20px);transform:scale(1.15) translateY(-40px);letter-spacing:.25em}}
.ring{position:relative;width:clamp(70px,13vh,120px);height:clamp(70px,13vh,120px);margin-top:16px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
#rBar{stroke:var(--tc);stroke-dasharray:283;stroke-dashoffset:0;stroke-linecap:round}
#sNum{position:absolute;inset:0;display:grid;place-items:center;font:400 clamp(30px,6vh,56px) var(--display)}
#qHead{font-weight:700;opacity:.8;font-size:clamp(14px,2.4vh,20px)}
#qText{font:400 clamp(30px,6.4vh,64px)/1.15 var(--display);max-width:1000px;margin:6px 0 18px;animation:pop .5s both}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(900px,94vw)}
.opt{font:700 clamp(18px,3.6vh,32px) var(--ui);padding:clamp(12px,2.6vh,24px);background:var(--glass);border:2px solid rgba(255,255,255,.25);border-radius:14px;color:var(--chalk);cursor:pointer;animation:pop .4s both}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}.opt:nth-child(4){animation-delay:.21s}
.opt.good{background:#1FBF6A;color:#06210F;border-color:#1FBF6A}
.opt.bad{background:#E0364B;border-color:#E0364B;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
#rBig{font:400 clamp(90px,26vh,260px)/1 var(--display);color:var(--tc);animation:pop .7s both}
#rMsg{font:400 clamp(28px,6vh,56px) var(--display)}
#podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;height:clamp(200px,42vh,420px);width:100%}
.pc{flex:1;max-width:210px;display:flex;flex-direction:column;align-items:center;animation:rise .8s both}
.pc b{font:400 clamp(16px,3.4vh,30px) var(--display);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc em{font:400 clamp(30px,7vh,64px) var(--display);font-style:normal}
.pc div{width:100%;background:linear-gradient(var(--c),color-mix(in srgb,var(--c) 40%,#000));border-radius:10px 10px 0 0;display:grid;place-items:start center;padding-top:8px;font:400 clamp(24px,5vh,48px) var(--display)}
@keyframes rise{from{transform:translateY(80px);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:640px){#opts{grid-template-columns:1fr}.tile em{font-size:24px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.screen{padding-bottom:40px}
#ft{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-size:12px;opacity:.6;z-index:4;pointer-events:none;padding:0 90px}
#mute{position:fixed;right:10px;bottom:6px;z-index:60;padding:.1em .5em;font-size:20px;border-radius:10px;box-shadow:none}
#fl span{position:fixed;bottom:-60px;font-size:clamp(24px,5vh,48px);opacity:.18;animation:flt linear infinite;pointer-events:none}
@keyframes flt{to{transform:translateY(-120vh) rotate(360deg)}}
#gHead{font:400 clamp(24px,5vh,44px) var(--display);color:var(--tc);animation:slide .5s both}
#gInfo{min-height:1.3em}
#gTime{width:min(700px,90vw);height:10px;border-radius:9px;background:rgba(255,255,255,.15);margin:0 0 12px;overflow:hidden}
#gTime i{display:block;height:100%;width:0;background:var(--tc);border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:clamp(6px,1.2vh,12px);width:min(var(--w,640px),92vw);margin:auto}
.cell,.fc{aspect-ratio:1;border-radius:12px;font:400 clamp(20px,5vh,46px) var(--display);color:var(--chalk);background:var(--glass);border:2px solid rgba(255,255,255,.25);cursor:pointer;transition:transform .15s,background .2s;animation:pop .4s backwards}
.cell:active{transform:scale(.9)}
.cell.sel{background:var(--tc);color:#14100A;transform:scale(1.1)}
.cell.found,.cell.good{background:#1FBF6A;color:#06210F;animation:pulse .6s}
.cell.bad{background:#E0364B;animation:shake .4s}
.cell.lit{background:var(--gold);box-shadow:0 0 26px var(--gold);animation:pulse .6s infinite}
.cell.miss{outline:3px dashed var(--gold)}
.fc{position:relative;transition:transform .45s,background .3s;font-size:clamp(28px,8vh,70px)}
.fc span,.fc b{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;font-weight:400}
.fc b{transform:rotateY(180deg)}
.fc.on{transform:rotateY(180deg)}
.fc.ok{background:#1FBF6A;box-shadow:0 0 24px #1FBF6A}
.nb{font:400 clamp(100px,30vh,300px)/1 var(--display);color:var(--tc);animation:pop .5s both;text-shadow:0 0 40px var(--tc)}
#path{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(900px,94vw);margin:8px 0 14px}
.lv{display:flex;flex-direction:column;align-items:center;gap:3px;padding:clamp(10px,2vh,18px);border-radius:16px;border:2px solid rgba(255,255,255,.25);background:var(--glass);color:var(--chalk);font-family:var(--ui);cursor:pointer;animation:rise .6s both}
.lv i{font:normal 400 clamp(30px,7vh,60px) var(--ui)}
.lv b{font:400 clamp(18px,3.4vh,28px) var(--display)}
.lv span{font-weight:700}
.lv em{font-style:normal;font-size:13px;padding:2px 10px;border-radius:20px;background:rgba(255,255,255,.14)}
.lv.open{border-color:var(--gold);box-shadow:0 0 30px rgba(255,201,40,.45);animation:rise .6s both,pulse 1.4s 1s infinite}
.lv.lock{opacity:.45;cursor:not-allowed}
.lv.done{border-color:#1FBF6A}
.lv.fresh i{animation:unl 1s .3s both}
@keyframes unl{0%{transform:scale(3) rotate(-30deg);opacity:0}60%{transform:scale(.8)}100%{transform:none;opacity:1}}
@media (max-width:640px){#path{grid-template-columns:1fr 1fr}}
:root{--vh:100vh}@supports(height:100dvh){:root{--vh:100dvh}}
.screen{justify-content:flex-start;overflow-x:hidden}
.screen>:first-child{margin-top:auto}.screen>:last-child{margin-bottom:auto}
.grid{grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
.cell,.fc{min-width:0;min-height:0;overflow:hidden;padding:0;font-family:var(--display),'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.fc{font-size:clamp(24px,6vh,60px)}
.fc.on{transform:none;background:rgba(255,255,255,.92)}
@keyframes flp{from{transform:rotateY(90deg) scale(.6)}to{transform:none}}
.sbox{width:min(760px,94vw);text-align:left;background:var(--glass);border-radius:16px;padding:6px 18px 14px;margin:8px 0 14px}
.sbox h3{margin:14px 0 6px;color:var(--gold);font:400 20px var(--display);letter-spacing:.03em}
.ck{display:flex;gap:8px;align-items:center;font-weight:700;padding:4px 0;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--gold)}
#sl,#ss{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.sbox textarea{width:100%;height:80px;background:rgba(0,0,0,.35);color:var(--chalk);border:2px solid rgba(255,255,255,.18);border-radius:8px;font:700 16px var(--ui);padding:8px;user-select:text}
button.chip{color:var(--chalk);font:700 16px var(--ui);cursor:pointer}button.chip.gold{color:#14100A}
:root{--hw:max(220px,min(92vw,calc(var(--vh) - 330px),680px))}
@media (orientation:landscape){:root{--hw:max(220px,min(calc(92vw - 250px),calc(var(--vh) - 270px),700px))}}
#hw{display:flex;flex-direction:column;align-items:center;gap:10px}
@media (orientation:landscape){#hw{flex-direction:row;gap:22px}#hw .chips{flex-direction:column;width:210px}#hw .chip{font-size:20px;text-align:center}}
#gr .cell{border:3px solid #fff;background:rgba(255,255,255,.16);font-size:clamp(24px,5.8vh,60px);box-shadow:0 3px 0 rgba(0,0,0,.4);text-shadow:0 2px 0 rgba(0,0,0,.4)}
#gr .cell.sel{background:var(--tc);color:#14100A;text-shadow:none}
#gr .cell.found{background:#1FBF6A;color:#06210F;text-shadow:none}
#gr .cell.bad{background:#E0364B}
</style></head><body>

{t:'The Market Trip',s:'On **Saturday**, Meera walked to the market in **Jaipur**. She bought **6 mangoes**, **3 notebooks** and a **blue umbrella**. She met her uncle **Raman** near the gate.',q:[{q:'Which city was the market in?',a:'Jaipur',o:['Jodhpur','Jaisalmer','Udaipur']},{q:'How many mangoes did Meera buy?',a:'6',o:['3','9','12']}]},

{t:'Captain Ravi\'s Ship',s:'Captain Ravi\'s ship sailed from **Chennai** on **Tuesday** with **48 passengers** and **5 parrots**. After **3 days** it reached the **Andaman** islands.',q:[{q:'Where did the ship start?',a:'Chennai',o:['Kochi','Mumbai','Puri']},{q:'How many parrots were on board?',a:'5',o:['3','8','48']}]},
{t:'A Day at the Zoo',s:'At the zoo, Tara saw **4 elephants**, **9 monkeys**, **1 white tiger** and **2 giraffes**. The tiger slept under a **neem tree**.',q:[{q:'How many monkeys did Tara see?',a:'9',o:['4','2','1']},{q:'Under which tree did the tiger sleep?',a:'Neem',o:['Mango','Banyan','Peepal']}]},
